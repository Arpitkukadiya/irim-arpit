<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ========== RESET ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* ========== BODY ========== */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ========== CONTAINER ========== */
.container {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 38px 32px;
    border-radius: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: slideUp 0.6s ease;
}

/* ========== HEADER ========== */
.container h2 {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #0f172a;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin: 12px 0 32px;
}

/* ========== OTP GROUP ========== */
.otp-group {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    position: relative;
}

/* left lock icon */
.otp-group i {
    position: absolute;
    left: -30px;
    top: 50%;
    transform: translateY(-50%);
    color: #2563eb;
    font-size: 20px;
}

/* otp inputs */
.otp {
    width: 60px;
    height: 60px;
    font-size: 22px;
    text-align: center;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    transition: 0.3s;
}

.otp:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
    outline: none;
}

/* ========== ERROR ========== */
.error {
    font-size: 12px;
    color: #dc2626;
    text-align: center;
    margin-bottom: 12px;
    display: none;
}

/* ========== BUTTON ========== */
button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(37,99,235,0.4);
}

/* ========== RESEND LINK ========== */
.resend {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #64748b;
}

.resend a {
    color: #2563eb;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
}

.resend a:hover {
    text-decoration: underline;
}

/* ========== ANIMATION ========== */
@keyframes slideUp {
    from { opacity: 0; transform: translateY(25px);}
    to { opacity: 1; transform: translateY(0);}
}

/* ========== RESPONSIVE ========== */
@media (max-width: 480px) {
    .container {
        padding: 32px 24px;
    }
    .otp {
        width: 55px;
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>Verify Account 🔒</h2>
    <p class="subtitle">Enter the 4-digit code sent to your email</p>

    <div class="otp-group">
        <i class="fa-solid fa-key"></i>
        <input type="text" class="otp" maxlength="1" oninput="moveNext(this)">
        <input type="text" class="otp" maxlength="1" oninput="moveNext(this)">
        <input type="text" class="otp" maxlength="1" oninput="moveNext(this)">
        <input type="text" class="otp" maxlength="1" oninput="moveNext(this)">
    </div>

    <div class="error" id="otpError">Invalid OTP</div>

    <button onclick="verify()">Verify & Continue</button>

    <div class="resend">
        Didn’t receive code? <a onclick="resendOTP()">Resend</a>
    </div>
</div>

<script>
function moveNext(el) {
    if (!/^[0-9]$/.test(el.value)) {
        el.value = "";
        return;
    }
    if (el.nextElementSibling) {
        el.nextElementSibling.focus();
    }
}

function verify() {
    const inputs = document.querySelectorAll(".otp");
    let otp = "";
    inputs.forEach(input => otp += input.value);

    if (otp === "1234") {
        document.getElementById("otpError").style.display = "none";
        alert("Account verified successfully!");
        window.location.href = "index.html"; 
    } else {
        document.getElementById("otpError").style.display = "block";
    }
}

function resendOTP() {
    alert("New OTP sent: 1234 (demo)");
}
</script>

</body>
</html>
