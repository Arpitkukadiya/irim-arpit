<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRIM Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts & Icons --> 
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#eef2f7;color:#0f172a;overflow-x:hidden;}
.app{display:flex;min-height:100vh;position:relative;}

/* ================= SIDEBAR ================= */
.sidebar{
    width:260px;
    background:linear-gradient(180deg,#0f172a,#020617);
    color:#fff;
    padding:20px;
    transition:0.3s;
    z-index:100;
    position:fixed;
    height:100%;
    overflow-y:auto;
    left:0;
    top:0;
}
.sidebar img{
    width:80px;height:80px;border-radius:50%;
    border:3px solid #3b82f6;
}
.sidebar h3{margin-top:10px;font-weight:600}
.sidebar p{font-size:12px;color:#94a3b8}
.sidebar a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    margin:8px 0;
    color:#cbd5e1;
    border-radius:12px;
    text-decoration:none;
    transition:.3s;
    cursor:pointer;
}
.sidebar a:hover{background:#2563eb;color:#fff}
.logout{background:#dc2626;color:#fff;justify-content:center;display:flex;align-items:center;padding:10px}

/* ================= TOPBAR ================= */
.topbar {
    display: none;
    background: #020617;
    color: #fff;
    padding: 12px 16px;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    z-index: 200;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: top 0.3s ease;
}

.topbar button{
    background:#2563eb;
    border:none;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

/* ================= MAIN ================= */
.main{
    flex:1;
    margin-left:260px;
    transition:0.3s;
    padding-top:20px;
}

/* ================= GRID ================= */
.container{
    display:grid;
    grid-template-columns:280px 1fr 340px;
    gap:20px;
    padding:20px;
}
.panel,.card{
    background:#fff;
    border-radius:16px;
    padding:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.panel h3,.card h4{
    margin-bottom:12px;
    color:#1e3a8a;
}
#map{height:400px;border-radius:14px}

/* ================= TABLE ================= */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:300px;}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;}
th{background:#f1f5f9;white-space:nowrap;}
td{white-space:nowrap;}

/* ================= INCIDENT GRID ================= */
.incidents{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px;
    padding:0 20px 20px;
}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    z-index:1000;
}
.modal-content{
    background:#fff;
    width:95%;
    max-width:700px;
    padding:20px;
    border-radius:16px;
    max-height:90vh;
    overflow-y:auto;
}
.close{float:right;font-size:18px;cursor:pointer}

/* ================= OVERLAY ================= */
#overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:90;
}

/* ================= RESPONSIVE ================= */
@media(max-width:1200px){
    .container{grid-template-columns:1fr; padding:15px;}
    #map{height:350px;}
    .main{margin-left:0;}
}
@media(max-width:992px){
    .topbar{display:flex;}
    .main{margin-left:0;padding-top:60px;}
    .sidebar{
        width:100%;
        height:auto;
        left:0;
        top:-100%;
        border-radius:0 0 16px 16px;
        transition:top 0.3s ease;
    }
    .sidebar.show{
        top:0;
    }
    #overlay{display:block;}
    #map{height:300px;}
}
@media(max-width:768px){
    .container{grid-template-columns:1fr;gap:12px;padding:12px;}
    .panel,.card{padding:12px;}
    table{font-size:12px;}
    #map{height:260px;}
}
@media(max-width:480px){
    .sidebar{width:100%;}
    .panel,.card{padding:10px;}
    table{font-size:11px;}
    #map{height:220px;}
}

</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <strong>IRIM Admin Dashboard</strong>
  <button onclick="toggleMenu()">☰ Menu</button>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeMenu()"></div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div style="text-align:center;margin-bottom:20px;">
        <img src="https://i.pravatar.cc/150">
        <h3>Admin</h3>
        <p>IRIM Admin</p>
    </div>

    <a onclick="openModal('events')"><i class="fa fa-calendar-plus"></i> Manage Events</a>
    <a onclick="openModal('advertisements')"><i class="fa fa-bullhorn"></i> Manage Ads</a>
    <a onclick="openModal('users')"><i class="fa fa-users"></i> Manage Users</a>
    <a onclick="openModal('emergency')"><i class="fa fa-phone"></i> Emergency Contacts</a>
    <a onclick="openModal('parking')"><i class="fa fa-parking"></i> Parking Info</a>
    <a onclick="openModal('roadEvents')"><i class="fa fa-road"></i> Road Events</a>

    <hr style="border:1px solid #334155;margin:20px 0;">
    <a href="index.html" class="logout"><i class="fa fa-right-from-bracket"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">
<div class="container">

<div class="panel">
<h3>🗺 Live Event Map</h3>
<div id="map"></div>
</div>

<div class="panel">
<h3>📍 Current Events & Data</h3>
<div class="table-wrap" id="tableContainer"></div>
</div>
</div>

<div class="incidents">
<div class="card">
<h4>Live Events Overview</h4>
<div class="table-wrap" id="overviewTable"></div>
</div>
</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<div id="modalBody"></div>
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// ================= MAP =================
const map = L.map('map').setView([23.2156, 72.6369], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers = [];

// ================= DEMO DATA =================
let events = [{id:1, lat:23.2156, lng:72.6369, text:"Public Rally – Sector 11"},
              {id:2, lat:23.2180, lng:72.6400, text:"Road Maintenance – Infocity"}];
let ads = [{id:1,title:"IRIM Safety Ad",content:"Always Wear Helmet"}];
let users = [{id:1,name:"John Doe",email:"john@example.com"},{id:2,name:"Jane Smith",email:"jane@example.com"}];
let emergencies = [{id:1,service:"Police",contact:"100"},{id:2,service:"Ambulance",contact:"108"}];
let parking = [{id:1,city:"Ahmedabad",status:"Available"},{id:2,city:"Surat",status:"Full"}];
let roadEvents = [{id:1,location:"NH48 Bharuch",issue:"Accident"},{id:2,location:"SG Highway",issue:"Construction"}];

// ================= MAP MARKERS =================
function renderMapMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers = events.map(e=>L.marker([e.lat,e.lng],{icon:L.divIcon({html:"📍"})}).addTo(map).bindPopup(e.text));
}
renderMapMarkers();

// ================= MODAL =================
function openModal(type){
  const body=document.getElementById("modalBody");
  let html='';
  if(type==="events"){
    html=`<h3>Manage Events</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">
        <label>Event Name:</label><input type="text" id="eventName" required>
        <label>Latitude:</label><input type="number" step="0.0001" id="eventLat" required>
        <label>Longitude:</label><input type="number" step="0.0001" id="eventLng" required>
        <button type="submit" style="background:#16a34a;color:#fff;margin-top:10px;">Save Event</button>
      </form><hr>`;
    html+=generateTable(events,'events',['text','lat','lng']);
    body.innerHTML=html;
    document.getElementById("eventForm").onsubmit=function(e){
      e.preventDefault();
      const id=parseInt(document.getElementById("eventId").value);
      const name=document.getElementById("eventName").value;
      const lat=parseFloat(document.getElementById("eventLat").value);
      const lng=parseFloat(document.getElementById("eventLng").value);
      if(id){ const ev=events.find(e=>e.id===id); ev.text=name; ev.lat=lat; ev.lng=lng; } 
      else events.push({id:Date.now(),text:name,lat,lng});
      renderMapMarkers(); openModal('events');
    }
  }
  // Repeat for ads, users, emergency, parking, roadEvents like before
  document.getElementById("modal").style.display="flex";
}

function closeModal(){document.getElementById("modal").style.display="none";}

// ================= TABLE GENERATOR =================
function generateTable(data,module,fields){
  let header = '<table><tr>';
  fields.forEach(f=>header+=`<th>${f.charAt(0).toUpperCase()+f.slice(1)}</th>`);
  header+='<th>Actions</th></tr>';
  let rows = data.map(d=>`<tr>`+fields.map(f=>`<td>${f.includes('lat')||f.includes('lng')?parseFloat(d[f]).toFixed(4):d[f]}</td>`).join('')+
    `<td><button onclick="editItem('${module}',${d.id})" style="background:#2563eb;color:#fff;">Edit</button>
     <button onclick="deleteItem('${module}',${d.id})" style="background:#dc2626;color:#fff;">Delete</button></td></tr>`).join('');
  return header+rows+'</table>';
}

// ================= EDIT / DELETE =================
function editItem(module,id){ /* same as before */ }
function deleteItem(module,id){ /* same as before */ }

// ================= MOBILE SIDEBAR =================
const sidebarEl = document.getElementById("sidebar");
const overlayEl = document.getElementById("overlay");

function toggleMenu(){
  sidebarEl.classList.toggle("show");
  overlayEl.style.display=sidebarEl.classList.contains("show")?"block":"none";
}
function closeMenu(){
  sidebarEl.classList.remove("show");
  overlayEl.style.display="none";
}

// Auto hide topbar on scroll
function toggleMenu(){
    sidebarEl.classList.toggle("show");

    if(sidebarEl.classList.contains("show")){
        overlayEl.style.display = "block";
        document.body.style.overflow = "hidden"; // Prevent background scroll
    } else {
        overlayEl.style.display = "none";
        document.body.style.overflow = ""; // Restore scroll
    }

    // Small timeout to let sidebar animation finish, then refresh map
    setTimeout(() => {
        map.invalidateSize(); // Leaflet recalculates map size
        // Optional: scroll map into view
        document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
}


</script>

</body>
</html>
