<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login. </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>/* ========== RESET ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* ========== BODY ========== */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ========== CONTAINER ========== */
.container {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: slideUp 0.6s ease;
}

/* ========== HEADER ========== */
.container h2 {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #0f172a;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin: 12px 0 32px;
}

/* ========== INPUT GROUP ========== */
.input-group {
    position: relative;
    margin-bottom: 22px;
}

/* left icons */
.input-group .left-icon {
    position: absolute;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    font-size: 15px;
    color: #94a3b8;
    pointer-events: none;
}

/* input */
.input-group input {
    width: 100%;
    padding: 14px 46px 14px 46px;
    border-radius: 14px;
    border: 1.5px solid #e2e8f0;
    font-size: 14px;
    transition: 0.25s ease;
    background: #fff;
}

/* focus */
.input-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
    outline: none;
}

/* ========== EYE TOGGLE ========== */
.toggle-password {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    cursor: pointer;
    color: #64748b;
    font-size: 16px;
    transition: 0.2s;
}

.toggle-password:hover {
    color: #2563eb;
}

/* ========== ERROR TEXT ========== */
.error {
    margin-top: 6px;
    font-size: 12px;
    color: #dc2626;
    display: none;
}

/* ========== BUTTON ========== */
button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(37,99,235,0.4);
}

button.loading {
    opacity: 0.85;
    pointer-events: none;
}

/* ========== LINK ========== */
.link {
    margin-top: 24px;
    text-align: center;
    font-size: 14px;
}

.link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}

.link a:hover {
    text-decoration: underline;
}

/* ========== ANIMATION ========== */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 480px) {
    .container {
        padding: 32px 24px;
    }

    .container h2 {
        font-size: 22px;
    }
}

</style>
</head>

<body>

<div class="container">
    <h2>Welcome Back 👋</h2>
    <p class="subtitle">Sign in to continue</p>

   <div class="input-group">
    <i class="fa-solid fa-envelope left-icon"></i>
    <input type="email" id="email" placeholder="Email address">
    <div class="error" id="emailError">Please enter a valid email</div>
</div>

<div class="input-group">
    <i class="fa-solid fa-lock left-icon"></i>
    <input type="password" id="password" placeholder="Password">
    <span class="toggle-password" onclick="togglePassword()">
        <i class="fa-solid fa-eye" id="eyeIcon"></i>
    </span>
    <div class="error" id="passwordError">Password is required</div>
</div>


    <button id="loginBtn" onclick="login()">Login</button>

    <div class="link">
        Don’t have an account? <a href="register.html">Create account</a>
    </div>
</div>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    const eye = document.getElementById("eyeIcon");

    if (pass.type === "password") {
        pass.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        pass.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
    }
}

function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const btn = document.getElementById("loginBtn");

    let valid = true;

    if (!email.includes("@")) {
        emailError.style.display = "block";
        valid = false;
    } else emailError.style.display = "none";

    if (password.length < 4) {
        passwordError.style.display = "block";
        valid = false;
    } else passwordError.style.display = "none";

    if (valid) {
        btn.classList.add("loading");
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Logging in...`;

        // Redirect after 1.5s demo loading
        setTimeout(() => {
            window.location.href = "role.html"; // ✅ redirect to role page
        }, 1500);
    }
}
</script>

</body>
</html>
